<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR ปลาว่ายวน เพิ่มความเร็ว</title>
    
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: Sans-Serif; }
        
        /* สไตล์ปุ่มกด */
        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
        }

        .btn {
            background-color: #ff4757;
            border: none;
            color: white;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s;
        }

        .btn:active {
            background-color: #ff6b81;
            transform: scale(0.95);
        }

        #speed-display {
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- UI หน้าจอ -->
    <div id="ui-container">
        <div id="speed-display">ความเร็ว: <span id="current-speed">1</span>x</div>
        <button id="speed-btn" class="btn">⚡ เพิ่มความเร็ว!</button>
    </div>

    <!-- ฉาก A-Frame AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- กำหนด Hiro Marker -->
        <a-marker preset="hiro">
            
            <!-- โมเดลปลา (ใช้ทรงกระบอก+กล่องแบบง่ายเพื่อให้โค้ดจบในไฟล์เดียว) 
                 หรือเปลี่ยน <a-entity> ด้านล่างเป็น <a-gltf-model> ถ้ามีโมเดลจริง -->
            
            <a-entity id="fish-container" rotation="0 0 0">
                <!-- ตัวปลา -->
                <a-cone position="0.5 0 0" rotation="0 0 -90" radius-bottom="0.1" radius-top="0.01" height="0.4" color="orange"></a-cone>
                <!-- หาง -->
                <a-box position="0.75 0 0" width="0.05" height="0.2" depth="0.1" color="red"></a-box>
            </a-entity>

        </a-marker>

        <!-- กล้อง AR -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // เริ่มต้นค่า
        var currentSpeed = 1;
        var baseRotationSpeed = 100; // องศาต่อวินาที

        var fishContainer = document.getElementById('fish-container');
        var speedBtn = document.getElementById('speed-btn');
        var currentSpeedText = document.getElementById('current-speed');

        // ฟังก์ชันอัปเดตแอนิเมชั่น (เพราะ A-Frame 1.3.0+ แนะนำให้นึกถึง speed ใน logic)
        function updateAnimation() {
            // คำนวณความเร็วในการหมุนใหม่
            var newRotationSpeed = baseRotationSpeed * currentSpeed;

            // อัปเดตแอนิเมชั่นให้หมุนรอบแกน Y (ว่ายวน)
            // เราลบ component เก่าออกก่อนเพื่อให้มันเริ่มรอบใหม่ทันที
            fishContainer.removeAttribute('animation');
            
            // เพิ่ม component แอนิเมชั่นใหม่
            fishContainer.setAttribute('animation', {
                property: 'rotation',
                to: '0 360 0',
                loop: true,
                dur: (360 / newRotationSpeed) * 1000, // คำนวณระยะเวลา (ms) จากองศา
                easing: 'linear'
            });

            // อัปเดต UI
            currentSpeedText.innerText = currentSpeed.toFixed(1);
        }

        // เริ่มแอนิเมชั่นครั้งแรก
        updateAnimation();

        // เหตุการณ์เมื่อกดปุ่มเพิ่มความเร็ว
        speedBtn.addEventListener('click', function() {
            // เพิ่มความเร็วทีละ 0.5
            currentSpeed += 0.5;

            // จำกัดความเร็วสูงสุดไว้ที่ 5x (เพื่อไม่ให้ปลิว)
            if (currentSpeed > 5) {
                currentSpeed = 1; // เวียนกลับมา 1 ใหม่
            }

            // อัปเดตแอนิเมชั่น
            updateAnimation();
        });
    </script>
</body>
</html>
