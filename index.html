<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR 5 Fishes Swimming - Hiro Marker</title>

  <!-- A-Frame และ AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .speed-badge {
      background: rgba(0, 0, 0, 0.7);
      color: #00e676;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    button {
      min-width: 180px;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #ff4757;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      touch-action: manipulation;
      transition: transform 0.1s, background 0.2s;
    }

    button:active {
      transform: scale(0.95);
      background: #ff6b81;
    }
  </style>

  <script>
    // สคริปต์ควบคุมการว่ายวน ส่ายหาง และลอยตัวของปลา
    AFRAME.registerComponent('swim-fish', {
      schema: {
        radius: { type: 'number', default: 0.5 },
        speed: { type: 'number', default: 35 },
        height: { type: 'number', default: 0.2 },
        phase: { type: 'number', default: 0 }
      },

      init: function () {
        this.angle = this.data.phase;
        this.speedMultiplier = 1;
      },

      setMultiplier: function (mult) {
        this.speedMultiplier = mult;
      },

      tick: function (time, deltaTime) {
        if (!deltaTime) return;

        // คำนวณตำแหน่งวงกลม
        const currentSpeed = this.data.speed * this.speedMultiplier;
        this.angle += (currentSpeed * deltaTime) / 1000;

        const rad = THREE.MathUtils.degToRad(this.angle);
        const r = this.data.radius;

        const x = Math.cos(rad) * r;
        const z = Math.sin(rad) * r;
        const y = this.data.height + Math.sin(time / 250 + this.data.phase) * 0.03;

        this.el.object3D.position.set(x, y, z);

        // Vector ทิศทางการเคลื่อนที่
        const dx = -Math.sin(rad);
        const dz = Math.cos(rad);

        // หันหัวปลา (แกน +X) ไปตามทิศทางเคลื่อนที่อย่างถูกต้อง
        this.el.object3D.rotation.y = Math.atan2(-dz, dx);

        // ส่ายหาง
        const tail = this.el.querySelector('.fish-tail');
        if (tail) {
          tail.object3D.rotation.y = Math.sin(time / 80 * this.speedMultiplier) * 0.4;
        }
      }
    });

    // สร้างโมเดลปลา
    function createFishEntity(data) {
      const fish = document.createElement('a-entity');
      fish.setAttribute('swim-fish', `radius: ${data.radius}; speed: ${data.speed}; height: ${data.height}; phase: ${data.phase}`);

      fish.innerHTML = `
        <a-entity scale="0.6 0.6 0.6">
          <!-- ลำตัวปลา (หัวหันไปทางแกน +X) -->
          <a-sphere position="0 0 0" radius="0.2" scale="1 0.5 0.3" color="${data.bodyColor}"></a-sphere>

          <!-- ตาซ้าย-ขวา อยู่ด้านหน้า (+X) -->
          <a-sphere position="0.12 0.03 0.04" radius="0.03" color="#ffffff">
            <a-sphere position="0.01 0 0.015" radius="0.012" color="#000000"></a-sphere>
          </a-sphere>
          <a-sphere position="0.12 0.03 -0.04" radius="0.03" color="#ffffff">
            <a-sphere position="0.01 0 -0.015" radius="0.012" color="#000000"></a-sphere>
          </a-sphere>

          <!-- ครีบหลัง -->
          <a-cone position="-0.02 0.12 0" rotation="0 0 -30" radius-bottom="0.06" radius-top="0.001" height="0.1" color="${data.finColor}"></a-cone>

          <!-- ครีบข้าง -->
          <a-box position="0.04 -0.02 0.07" rotation="15 -30 -10" width="0.08" height="0.008" depth="0.04" color="${data.finColor}"></a-box>
          <a-box position="0.04 -0.02 -0.07" rotation="-15 -30 10" width="0.08" height="0.008" depth="0.04" color="${data.finColor}"></a-box>

          <!-- ข้อต่อหางส่ายได้ อยู่ด้านหลัง (-X) -->
          <a-entity class="fish-tail" position="-0.18 0 0">
            <a-cone position="-0.06 0 0" rotation="0 0 -90" radius-bottom="0.1" radius-top="0.001" height="0.12" color="${data.finColor}"></a-cone>
          </a-entity>
        </a-entity>
      `;
      return fish;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const fishGroup = document.querySelector('#fish-group');
      const speedBtn = document.querySelector('#speed-btn');
      const speedDisplay = document.querySelector('#speed-display');

      // กำหนดค่าปลาทั้ง 5 ตัว
      const fishesData = [
        { radius: 0.35, speed: 45, height: 0.20, phase: 0,   bodyColor: '#FF7F50', finColor: '#FF4500' }, // ส้ม
        { radius: 0.50, speed: 38, height: 0.30, phase: 72,  bodyColor: '#2ED573', finColor: '#10AC84' }, // เขียว
        { radius: 0.65, speed: 32, height: 0.15, phase: 144, bodyColor: '#FF9F1A', finColor: '#FF3838' }, // เหลือง
        { radius: 0.80, speed: 28, height: 0.35, phase: 216, bodyColor: '#A55EEA', finColor: '#FF78C4' }, // ม่วง
        { radius: 0.95, speed: 25, height: 0.25, phase: 288, bodyColor: '#18DCFF', finColor: '#0ABDE3' }  // ฟ้า
      ];

      const fishEntities = [];

      fishesData.forEach(data => {
        const fishEl = createFishEntity(data);
        fishGroup.appendChild(fishEl);
        fishEntities.push(fishEl);
      });

      // ปุ่มเพิ่มความเร็ว
      const speeds = [1, 1.5, 2, 3, 4];
      let speedIndex = 0;

      speedBtn.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        const currentMult = speeds[speedIndex];

        fishEntities.forEach(fish => {
          fish.components['swim-fish'].setMultiplier(currentMult);
        });

        speedDisplay.textContent = `ความเร็ว: ${currentMult}x`;
      });
    });
  </script>
</head>

<body>
  <div id="controls">
    <div id="speed-display" class="speed-badge">ความเร็ว: 1x</div>
    <button id="speed-btn" type="button">⚡ เพิ่มความเร็ว</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-marker preset="hiro" id="hiro-marker">
      <a-entity id="fish-group" position="0 0 0"></a-entity>
      <!-- วงน้ำบนพื้น Marker -->
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.1" radius-outer="1.0" color="#00d2d3" opacity="0.25"></a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
